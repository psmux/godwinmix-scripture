name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests, standard library only
        run: python -m unittest discover -s tests -t . -v
      - name: The panel's scripts parse
        if: matrix.python == '3.13'
        run: |
          node --check ui/panel.js
          node --check ui/onair.js
          node --check ui/preview.js
          node --check ui/dialogs.js

  release:
    name: release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build one archive per platform
        run: python tools/package.py "${GITHUB_REF_NAME}"
      - name: Check every archive holds the manifest one folder down
        run: |
          for f in dist/*.tar.gz; do tar -tzf "$f" | grep -q '^scripture-[^/]*/gmx-plugin.toml$'; done
          for f in dist/*.zip; do unzip -l "$f" | grep -q 'scripture-[^/]*/gmx-plugin.toml'; done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
          fi
